# Cấu hình Supabase CLI cho backend (chạy lệnh `supabase ...` từ thư mục backend/)
# Supabase CLI đọc migrations ở backend/supabase/migrations: xem backend/README.md (mục Cài đặt).
project_id = "nha-tro-pwa"

[auth]
site_url = "http://localhost:5173"

[auth.sms]
# Đăng nhập SĐT + mật khẩu; tài khoản do chủ trọ tạo nên không cần xác thực OTP
enable_signup = true
enable_confirmations = false

[auth.rate_limit]
token_verifications = 10

# Chỉ dùng số giả này để kiểm thử OTP local, không áp dụng vào production.
[auth.sms.test_otp]
84900000099 = "936284"

[db.seed]
enabled = true
sql_paths = ["../seed/001_seed_data.sql"]

# Hai function tự kiểm tra service-role key / CRON_SECRET (xem functions/_shared/guard.ts),
# nên tắt verify_jwt để chạy được cả với khóa API kiểu mới (sb_secret_...).
[functions.cron-reminders]
enabled = true
verify_jwt = false
entrypoint = "../functions/cron-reminders/index.ts"

[functions.send-webpush]
enabled = true
verify_jwt = false
entrypoint = "../functions/send-webpush/index.ts"

[auth.sms.twilio]
enabled = true
account_sid = "dummy"
message_service_sid = "dummy"
auth_token = "dummy"

[functions.manage-tenants]
enabled = true
verify_jwt = false
entrypoint = "../functions/manage-tenants/index.ts"

[functions.manage-staff]
enabled = true
verify_jwt = false
entrypoint = "../functions/manage-staff/index.ts"

[functions.sepay-webhook]
enabled = true
verify_jwt = false
entrypoint = "../functions/sepay-webhook/index.ts"
